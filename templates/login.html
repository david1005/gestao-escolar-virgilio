<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Gestão Escolar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
    <script src="/static/js/theme.js?v=1"></script>
    <script src="/static/js/security.js?v=1"></script>
    <style>
        body {
            background: linear-gradient(135deg, #0d6efd, #0a58ca);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card-login {
            width: 100%;
            max-width: 400px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>
    <div class="card card-login p-4">
        <div class="text-center mb-4">
            <i class="bi bi-mortarboard-fill text-primary" style="font-size: 3rem;"></i>
            <h4 class="fw-bold mt-2">Gestão Escolar</h4>
            <p class="text-muted">Escola Virgílio Távora</p>
        </div>

        <div id="alertaErro" class="alert alert-danger d-none"></div>

        <div class="mb-3">
            <label class="form-label fw-semibold">Email</label>
            <input type="email" class="form-control" id="email" placeholder="seu@email.com">
        </div>
        <div class="mb-4">
            <label class="form-label fw-semibold">Senha</label>
            <div class="input-group">
                <input type="password" class="form-control" id="senha" placeholder="Sua senha">
                <button class="btn btn-outline-secondary" type="button" onclick="toggleSenha()">
                    <i class="bi bi-eye" id="iconeSenha"></i>
                </button>
            </div>
        </div>

        <button class="btn btn-primary w-100 fw-semibold" onclick="fazerLogin()">
            <i class="bi bi-box-arrow-in-right me-2"></i>Entrar
        </button>
    </div>

    <script>
        async function fazerLogin() {
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;
            const alerta = document.getElementById('alertaErro');

            if (!email || !senha) {
                alerta.textContent = 'Preencha email e senha!';
                alerta.classList.remove('d-none');
                return;
            }

            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, senha })
            });

            if (res.ok) {
                window.location.href = '/';
            } else {
                const erro = await res.json();
                alerta.textContent = erro.detail || 'Email ou senha incorretos!';
                alerta.classList.remove('d-none');
            }
        }

        function toggleSenha() {
            const input = document.getElementById('senha');
            const icone = document.getElementById('iconeSenha');
            if (input.type === 'password') {
                input.type = 'text';
                icone.className = 'bi bi-eye-slash';
            } else {
                input.type = 'password';
                icone.className = 'bi bi-eye';
            }
        }

        document.getElementById('senha').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') fazerLogin();
        });
    </script>
</body>
</html>
